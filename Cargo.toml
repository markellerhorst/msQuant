[package]
name = "msquant"
version = "0.1.0"
edition = "2026"
description = "Targeted LC-MS/MS quantification from Thermo .raw and mzML files"
repository = "https://github.com/markellerhorst/lcms-quant"
homepage = "https://github.com/markellerhorst/lcms-quant"
license = "MIT"
readme = "README.md"
build = "build.rs"

[lib]
name = "msquant"
path = "src/lib.rs"

[[bin]]
name = "msQuant"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.29"
rfd = "0.15"          # native file dialogs

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"   # embeds the .exe icon

[profile.release]
opt-level = 3
lto = true
